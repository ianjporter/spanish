    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --light: #ecf0f1;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .controls {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, select {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: var(--accent);
            color: var(--white);
            transition: background-color 0.3s ease;
        }
        button:hover, select:hover {
            background-color: #2980b9;
        }
        .flashcard-container {
            width: 100%;
            max-width: 500px;
            height: 300px;
            perspective: 1000px;
            margin-bottom: 2rem;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--white);
            border-radius: 12px;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background-color: var(--secondary);
            color: var(--white);
        }
        .word {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .type-badge {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .flashcard-back .type-badge {
            background: rgba(255,255,255,0.2);
        }
        .navigation {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .counter {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Academic & IT Spanish Vocabulary</h1>
    
    <div class="controls">
        <select id="typeFilter" onchange="filterCards()">
            <option value="all">All Words</option>
            <option value="noun">Nouns Only</option>
            <option value="verb">Verbs Only</option>
        </select>
        <select id="languageToggle" onchange="toggleLanguage()">
            <option value="es">Spanish First</option>
            <option value="en">English First</option>
        </select>
        <button onclick="shuffleCards()">Shuffle Deck</button>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="flashcard-face flashcard-front">
                <div class="word" id="front-word">Cargando...</div>
                <div class="type-badge" id="front-type">...</div>
            </div>
            <div class="flashcard-face flashcard-back">
                <div class="word" id="back-word">Loading...</div>
                <div class="type-badge" id="back-type">...</div>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button onclick="prevCard()">&#8592; Previous</button>
        <div class="counter" id="counter">0 / 0</div>
        <button onclick="nextCard()">Next &#8594;</button>
    </div>

        let currentDeck = [...allVocab];
        let currentIndex = 0;
        let spanishFirst = true;

        const cardElement = document.getElementById('flashcard');
        const frontWordElement = document.getElementById('front-word');
        const backWordElement = document.getElementById('back-word');
        const frontTypeElement = document.getElementById('front-type');
        const backTypeElement = document.getElementById('back-type');
        const counterElement = document.getElementById('counter');

        function toggleLanguage() {
            spanishFirst = document.getElementById('languageToggle').value === 'es';
            updateCard();
        }

        function updateCard() {
            if (currentDeck.length === 0) {
                frontWordElement.textContent = "No cards";
                backWordElement.textContent = "No cards";
                frontTypeElement.textContent = "";
                backTypeElement.textContent = "";
                counterElement.textContent = "0 / 0";
                return;
            }

            // Ensure card is showing the front when updating
            cardElement.classList.remove('is-flipped');
            
            setTimeout(() => {
                const card = currentDeck[currentIndex];
                
                if (spanishFirst) {
                    frontWordElement.textContent = card.es;
                    backWordElement.textContent = card.en;
                } else {
                    frontWordElement.textContent = card.en;
                    backWordElement.textContent = card.es;
                }

                frontTypeElement.textContent = card.type;
                backTypeElement.textContent = card.type;
                counterElement.textContent = `${currentIndex + 1} / ${currentDeck.length}`;
            }, 150); // slight delay to allow flip animation to reset smoothly
        }

        function flipCard() {
            if (currentDeck.length > 0) {
                cardElement.classList.toggle('is-flipped');
            }
        }

        function nextCard() {
            if (currentDeck.length > 0) {
                currentIndex = (currentIndex + 1) % currentDeck.length;
                updateCard();
            }
        }

        function prevCard() {
            if (currentDeck.length > 0) {
                currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
                updateCard();
            }
        }

        function filterCards() {
            const filterValue = document.getElementById('typeFilter').value;
            if (filterValue === 'all') {
                currentDeck = [...allVocab];
            } else {
                currentDeck = allVocab.filter(word => word.type === filterValue);
            }
            currentIndex = 0;
            updateCard();
        }

        function shuffleCards() {
            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        // Initialize first card
        updateCard();
