        button:hover, select:hover {

        }
        .flashcard-container {
            width: 100%;
            max-width: 500px;
            height: 300px;
            perspective: 1000px;
            margin-bottom: 2rem;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--white);
            border-radius: 12px;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background-color: var(--secondary);
            color: var(--white);
        }
        .word {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            word-break: break-word;
        }
        .type-badge {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .flashcard-back .type-badge {
            background: rgba(255,255,255,0.2);
        }
        .navigation {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .counter {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
